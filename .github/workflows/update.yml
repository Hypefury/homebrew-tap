# Points the formula at the newest v* tag of Hypefury/blackroija.
# Runs every hour and on demand. Needs no secrets.
name: Update formula
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump to the newest tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh api repos/Hypefury/blackroija/tags --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -z "$tag" ]; then echo "No v* tag yet."; exit 0; fi
          url="https://github.com/Hypefury/blackroija/archive/refs/tags/${tag}.tar.gz"
          if grep -q "$url" Formula/blackroija.rb; then echo "Already on $tag."; exit 0; fi
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i -E "s|^  url .*|  url \"$url\"|; s|^  sha256 .*|  sha256 \"$sha\"|" Formula/blackroija.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "blackroija ${tag#v}"
          git push
